{% set name = "arabic_reshaper" %}
{% set version = "3.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: a0d9b2a9fa29b5f2c1d705f407adf6ca4242405b9cac0e5cc09e6c4f3f8fb68c

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

{% set python_min = "3.10" %}

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - arabic_reshaper
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/mpcabd/python-arabic-reshaper
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Reconstruct Arabic sentences to be used in applications that do not support Arabic

extra:
  recipe-maintainers:
    - kastman
    - mrakitin
    - mpcabd
